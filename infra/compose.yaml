name: agentic-rag-analyst

services:
  mysql:
    profiles: [eval]
    image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${EVAL_MYSQL_ROOT_PASSWORD:-eval-root-dev}
      MYSQL_DATABASE: analyst_eval
      MYSQL_USER: eval_analyst
      MYSQL_PASSWORD: ${EVAL_MYSQL_PASSWORD:-eval-analyst-dev}
    ports:
      - "127.0.0.1:${EVAL_MYSQL_PORT:-33306}:3306"
    volumes:
      - mysql_eval_data:/var/lib/mysql
      - ../evals/fixtures/v1/seed-mysql.sql:/docker-entrypoint-initdb.d/001-synthetic.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analyst}
      POSTGRES_USER: ${POSTGRES_USER:-analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analyst}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  rustfs-volume-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data && chown 10001:10001 /data"]
    volumes:
      - rustfs_data:/data
    restart: "no"

  rustfs:
    image: ghcr.io/rustfs/rustfs:1.0.0-glibc@sha256:bffcab0c9d647aab0055d1c69d340b202d0909966b385932d4ead1aeb7602858
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-analyst-dev}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-analyst-dev-secret}
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-19000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-19001}:9001"
    volumes:
      - rustfs_data:/data
    depends_on:
      rustfs-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


volumes:
  mysql_eval_data:
  postgres_data:
  rustfs_data:
