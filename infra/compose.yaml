name: agentic-rag-analyst

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analyst}
      POSTGRES_USER: ${POSTGRES_USER:-analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analyst}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  rustfs-volume-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data && chown 10001:10001 /data"]
    volumes:
      - rustfs_data:/data
    restart: "no"

  rustfs:
    image: ghcr.io/rustfs/rustfs:1.0.0-glibc@sha256:bffcab0c9d647aab0055d1c69d340b202d0909966b385932d4ead1aeb7602858
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-analyst-dev}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-analyst-dev-secret}
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-19000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-19001}:9001"
    volumes:
      - rustfs_data:/data
    depends_on:
      rustfs-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  bucket-init:
    profiles: [fullstack]
    build:
      context: ../backend
      dockerfile: Dockerfile
    working_dir: /app/backend
    command: ["uv", "run", "python", "-m", "app.storage.initialize"]
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://analyst:analyst@db:5432/analyst}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-analyst-dev}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-analyst-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-analyst}
      S3_REGION: ${S3_REGION:-us-east-1}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      SANDBOX_BASE_URL: ${SANDBOX_DOCKER_BASE_URL:-http://host.docker.internal:8787}
      SANDBOX_AUTH_TOKEN: ${SANDBOX_AUTH_TOKEN:-}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-hari31416/data-science-heavy-runtime:py312-v2@sha256:73520043dc5aa0a30475b8b8a11bf8cc9fea1236540c54b83055d9e876d32fec}
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY:-}
      EXTERNAL_PROVIDER_POLICY: ${EXTERNAL_PROVIDER_POLICY:-local_only}
      SUPPORTED_LANGUAGES: ${SUPPORTED_LANGUAGES:-}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-20}
      MAX_MODEL_CALLS: ${MAX_MODEL_CALLS:-20}
      MAX_CONTEXT_CHARACTERS: ${MAX_CONTEXT_CHARACTERS:-60000}
      MAX_RESULT_BYTES: ${MAX_RESULT_BYTES:-65536}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-300}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
    volumes:
      - ../backend:/app/backend
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [fullstack]
    build:
      context: ../backend
      dockerfile: Dockerfile
    working_dir: /app/backend
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://analyst:analyst@db:5432/analyst}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-analyst-dev}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-analyst-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-analyst}
      S3_REGION: ${S3_REGION:-us-east-1}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      SANDBOX_BASE_URL: ${SANDBOX_DOCKER_BASE_URL:-http://host.docker.internal:8787}
      SANDBOX_AUTH_TOKEN: ${SANDBOX_AUTH_TOKEN:-}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-hari31416/data-science-heavy-runtime:py312-v2@sha256:73520043dc5aa0a30475b8b8a11bf8cc9fea1236540c54b83055d9e876d32fec}
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY:-}
      EXTERNAL_PROVIDER_POLICY: ${EXTERNAL_PROVIDER_POLICY:-local_only}
      SUPPORTED_LANGUAGES: ${SUPPORTED_LANGUAGES:-}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-20}
      MAX_MODEL_CALLS: ${MAX_MODEL_CALLS:-20}
      MAX_CONTEXT_CHARACTERS: ${MAX_CONTEXT_CHARACTERS:-60000}
      MAX_RESULT_BYTES: ${MAX_RESULT_BYTES:-65536}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-300}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
    volumes:
      - ../backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    profiles: [fullstack]
    build:
      context: ../backend
      dockerfile: Dockerfile
    working_dir: /app/backend
    command: ["uv", "run", "python", "-m", "app.workers.main"]
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://analyst:analyst@db:5432/analyst}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-analyst-dev}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-analyst-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-analyst}
      S3_REGION: ${S3_REGION:-us-east-1}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      SANDBOX_BASE_URL: ${SANDBOX_DOCKER_BASE_URL:-http://host.docker.internal:8787}
      SANDBOX_AUTH_TOKEN: ${SANDBOX_AUTH_TOKEN:-}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-hari31416/data-science-heavy-runtime:py312-v2@sha256:73520043dc5aa0a30475b8b8a11bf8cc9fea1236540c54b83055d9e876d32fec}
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY:-}
      EXTERNAL_PROVIDER_POLICY: ${EXTERNAL_PROVIDER_POLICY:-local_only}
      SUPPORTED_LANGUAGES: ${SUPPORTED_LANGUAGES:-}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-20}
      MAX_MODEL_CALLS: ${MAX_MODEL_CALLS:-20}
      MAX_CONTEXT_CHARACTERS: ${MAX_CONTEXT_CHARACTERS:-60000}
      MAX_RESULT_BYTES: ${MAX_RESULT_BYTES:-65536}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-300}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
    volumes:
      - ../backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy

  frontend:
    profiles: [fullstack]
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port 5173"]
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      API_PROXY_URL: http://api:8000
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres_data:
  rustfs_data:
  frontend_node_modules:
